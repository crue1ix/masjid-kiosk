<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121009">
<link rel="manifest" href="manifest.json">
<title>Masjid Al-Hayy Kiosk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="star-field"></div>

<!-- ===================== AD REEL VIEW ===================== -->
<div id="ad-view">
  <div id="ad-media-wrap">
    <div id="ad-empty-state">
      No content yet.<br>
      Upload media from the admin page.
    </div>
  </div>
</div>

<!-- ===================== STAR WIPE TRANSITION ===================== -->
<div id="star-wipe">
  <svg viewBox="0 0 120 120">
    <path fill="#C9A227" d="M60 10 L70 40 L100 30 L80 55 L110 60 L80 65 L100 90 L70 80 L60 110 L50 80 L20 90 L40 65 L10 60 L40 55 L20 30 L50 40 Z"/>
  </svg>
</div>

<!-- ===================== HUB VIEW ===================== -->
<div id="hub-view" class="hidden">
  <div class="star-field"></div>
  <div id="kiosk-clock">
    <div id="kiosk-clock-date"></div>
    <div id="kiosk-clock-time"></div>
  </div>
  <div class="hub-header">
    <div class="hub-header-spacer"></div>
    <div class="hub-header-center">
      <img src="assets/Al-Hayy Logo.png" class="hub-logo" alt="Masjid Al-Hayy">
    </div>
    <button class="back-to-ads" id="btn-back-to-ads">← Back</button>
  </div>

  <div class="hub-grid" id="hub-grid">
    <div class="hub-tile" data-panel="prayer">
      <div>
        <img src="assets/PrayerTimes.png" class="hub-tile-icon" alt="Prayer Times">
        <div class="hub-tile-label">Prayer Times</div>
      </div>
    </div>
    <div class="hub-tile" data-panel="whatsapp">
      <div>
        <img src="assets/WhatsApp Icon.webp" class="hub-tile-icon hub-tile-icon-whatsapp" alt="Join WhatsApp">
        <div class="hub-tile-label">Join WhatsApp</div>
      </div>
    </div>
    <div class="hub-tile" data-panel="announcements">
      <div>
        <img src="assets/Announcements.png" class="hub-tile-icon" alt="Announcements">
        <div class="hub-tile-label">Announcements</div>
      </div>
    </div>
    <div class="hub-tile" data-panel="events">
      <div>
        <img src="assets/Calender.png" class="hub-tile-icon" alt="Events">
        <div class="hub-tile-label">Events</div>
      </div>
    </div>
    <div class="hub-tile" data-panel="donate">
      <div>
        <img src="assets/Dontation.png" class="hub-tile-icon" alt="Donate">
        <div class="hub-tile-label">Donate</div>
      </div>
    </div>
    <div class="hub-tile" data-panel="about">
      <div>
        <img src="assets/Info.png" class="hub-tile-icon" alt="About & Contact">
        <div class="hub-tile-label">About & Contact</div>
      </div>
    </div>
  </div>

  <!-- Detail panel, shown when a tile is tapped -->
  <div id="hub-detail" class="hidden">
    <div class="detail-header">
      <button class="detail-back" id="btn-detail-back">← Back</button>
      <div class="detail-title" id="detail-title">Title</div>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================================================
   KIOSK LOCKDOWN — keeps the page fullscreen, awake, and free of
   browser chrome/gestures that would let someone escape to the OS.
   This is a second layer on top of the kiosk launcher app (e.g.
   FreeKiosk) doing the OS-level lock; either one alone is enough
   to stop casual exits, but together they cover more escape paths.
   ============================================================ */
function requestKioskFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) return;
  try {
    Promise.resolve(req.call(el)).catch(() => {});
  } catch (e) { /* older browsers throw synchronously instead of rejecting */ }
}

// Fullscreen requires a user gesture in most browsers, so re-request it
// on every tap in case the OS/browser kicked it out of fullscreen.
document.addEventListener('click', requestKioskFullscreen);
document.addEventListener('touchend', requestKioskFullscreen);

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* not supported / permission denied — harmless */ }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// Block gestures/menus that would let someone leave the page or copy content.
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('keydown', e => {
  // Best-effort only — browsers ignore preventDefault on OS-level shortcuts,
  // but this stops in-page navigation shortcuts a stray keyboard could trigger.
  const blocked = ['F11', 'F5', 'F12'];
  if (blocked.includes(e.key) || (e.ctrlKey && ['r', 'w', 't', 'n'].includes(e.key.toLowerCase()))) {
    e.preventDefault();
  }
});

/* ============================================================
   KIOSK SETTINGS (real-time from Firestore)
   ============================================================ */
let kioskLocked = false;
let hubIdleTimeoutMs = KIOSK_CONFIG.hubIdleTimeoutSeconds * 1000;
let specialReels = { prayerTimes: false };
let prayerReelDurationMs = 15000;
const tapHint = document.querySelector('.tap-hint');

db.collection('settings').doc('kiosk').onSnapshot(doc => {
  const data = doc.exists ? doc.data() : {};
  kioskLocked = data.locked || false;
  if (tapHint) tapHint.style.display = kioskLocked ? 'none' : '';
  hubIdleTimeoutMs = (data.hubIdleTimeoutSeconds || KIOSK_CONFIG.hubIdleTimeoutSeconds) * 1000;
  specialReels.prayerTimes = !!(data.specialReels && data.specialReels.prayerTimes);
  prayerReelDurationMs = ((data.specialReels && data.specialReels.prayerTimesDurationSeconds) || 15) * 1000;
  rebuildPlaylist();
});

/* ============================================================
   HUB CLOCK (hidden automatically with #hub-view during the ad reel)
   ============================================================ */
const clockDateEl = document.getElementById('kiosk-clock-date');
const clockTimeEl = document.getElementById('kiosk-clock-time');

function updateClock() {
  const now = new Date();
  clockDateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  clockTimeEl.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

updateClock();
setInterval(updateClock, 1000);

/* ============================================================
   AD REEL
   ============================================================ */
let rawAds = [];
let ads = [];
let currentAdIndex = 0;
let adTimer = null;
const adView = document.getElementById('ad-view');
const adWrap = document.getElementById('ad-media-wrap');

// Live-updates whenever ads are added/removed/edited from admin.html.
// (Filtering "active" here in JS, rather than in the query, avoids needing
// a Firestore composite index.)
db.collection('ads').orderBy('order').onSnapshot(snapshot => {
  const now = Date.now();
  rawAds = snapshot.docs
    .map(doc => doc.data())
    .filter(ad => ad.active)
    .filter(ad => !ad.expiresAt || ad.expiresAt.toMillis() > now);
  rebuildPlaylist();
});

// Special reels (e.g. prayer times) aren't part of the orderable `ads` list —
// they're appended once per full loop, independent of manual ordering.
function rebuildPlaylist() {
  ads = specialReels.prayerTimes ? rawAds.concat([{ type: 'special', special: 'prayerTimes' }]) : rawAds.slice();
  currentAdIndex = 0;
  playCurrentAd();
}

function playCurrentAd() {
  clearTimeout(adTimer);
  adWrap.innerHTML = '';

  if (ads.length === 0) {
    adWrap.innerHTML = '<div id="ad-empty-state">No content yet.<br>Upload media from the admin page.</div>';
    return;
  }

  const ad = ads[currentAdIndex % ads.length];

  if (ad.type === 'special' && ad.special === 'prayerTimes') {
    renderPrayerReelSlide();
  } else if (ad.type === 'video') {
    const video = document.createElement('video');
    video.src = ad.url;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.onended = advanceAd;
    // Safety net in case a video fails to load or play
    video.onerror = advanceAd;
    adWrap.appendChild(video);
  } else {
    const bg = document.createElement('img');
    bg.src = ad.url;
    bg.className = 'ad-media-bg';
    bg.alt = '';
    adWrap.appendChild(bg);

    const img = document.createElement('img');
    img.src = ad.url;
    adWrap.appendChild(img);
    const duration = (ad.duration || KIOSK_CONFIG.defaultImageDuration) * 1000;
    adTimer = setTimeout(advanceAd, duration);
  }
}

function advanceAd() {
  currentAdIndex = (currentAdIndex + 1) % Math.max(ads.length, 1);
  playCurrentAd();
}

function renderPrayerReelSlide() {
  adWrap.innerHTML = '<div class="ad-prayer-slide"><p>Loading…</p></div>';
  getPrayerTimes(t => {
    adWrap.innerHTML = buildPrayerReelHtml(t);
    adTimer = setTimeout(advanceAd, prayerReelDurationMs);
  }, () => advanceAd());
}

function buildPrayerReelHtml(t) {
  const order = ['Fajr', 'Sunrise', 'Dhuhr', 'Maghrib', 'Midnight'];
  const today = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  return `
    <div class="ad-prayer-slide">
      <div class="star-field"></div>
      <div class="ad-prayer-header">
        <div class="ad-prayer-heading">Prayer Times</div>
        <div class="ad-prayer-rule"></div>
        <div class="ad-prayer-date">${today}</div>
      </div>
      <div class="ad-prayer-row">${order.map(name => `
        <div class="ad-prayer-segment">
          <div class="name">${name}</div>
          <div class="time">${to12Hour(t[name])}</div>
        </div>
      `).join('')}</div>
      <img src="assets/Al-Hayy Logo.png" class="ad-prayer-logo" alt="Masjid Al-Hayy">
    </div>
  `;
}

/* ============================================================
   MODE SWITCHING (ad reel <-> hub) with star-wipe transition
   ============================================================ */
const hubView = document.getElementById('hub-view');
const starWipe = document.getElementById('star-wipe');
const hubGrid = document.getElementById('hub-grid');
const hubDetail = document.getElementById('hub-detail');
const hubHeader = document.querySelector('.hub-header');
let hubIdleTimer = null;
let calendarViewDate = new Date();
let calendarSelectedDate = null;
let currentMonthPrograms = {};
let programsUnsub = null;

function playWipe(callback) {
  starWipe.classList.add('playing');
  setTimeout(() => {
    callback();
    starWipe.classList.remove('playing');
  }, 350);
}

function revealView(view, direction) {
  const cls = direction === 'back' ? 'revealing-back' : 'revealing';
  view.classList.remove('revealing', 'revealing-back');
  // Force reflow so the animation restarts even if it's already applied
  void view.offsetWidth;
  view.classList.add(cls);
  setTimeout(() => view.classList.remove(cls), 450);
}

function openHub() {
  if (kioskLocked) return;
  playWipe(() => {
    adView.classList.add('hidden');
    hubView.classList.remove('hidden');
    revealView(hubView);
    showHubGrid();
    resetHubIdleTimer();
    // Pause any playing ad video
    const v = adWrap.querySelector('video');
    if (v) v.pause();
  });
}

function closeHub() {
  clearTimeout(hubIdleTimer);
  playWipe(() => {
    hubView.classList.add('hidden');
    adView.classList.remove('hidden');
    revealView(adView, 'back');
    playCurrentAd();
  });
}

function resetHubIdleTimer() {
  clearTimeout(hubIdleTimer);
  hubIdleTimer = setTimeout(closeHub, hubIdleTimeoutMs);
}

adView.addEventListener('click', openHub);
document.getElementById('btn-back-to-ads').addEventListener('click', closeHub);
hubView.addEventListener('click', resetHubIdleTimer);
hubView.addEventListener('touchstart', resetHubIdleTimer);

/* ============================================================
   HUB TILE PANELS
   ============================================================ */
function showHubGrid(direction) {
  hubGrid.classList.remove('hidden');
  hubDetail.classList.add('hidden');
  revealView(hubGrid, direction);
  if (direction === 'back') revealView(hubHeader, 'back');
  if (programsUnsub) { programsUnsub(); programsUnsub = null; }
}

function showDetail(panel) {
  hubGrid.classList.add('hidden');
  hubDetail.classList.remove('hidden');
  revealView(hubDetail);
  loadPanel(panel);
}

document.querySelectorAll('.hub-tile').forEach(tile => {
  tile.addEventListener('click', () => showDetail(tile.dataset.panel));
});

document.getElementById('btn-detail-back').addEventListener('click', () => showHubGrid('back'));

function loadPanel(panel) {
  const title = document.getElementById('detail-title');
  const body = document.getElementById('detail-body');
  body.innerHTML = '<p>Loading…</p>';

  if (panel === 'prayer') {
    title.textContent = 'Prayer Times';
    getPrayerTimes(
      t => renderPrayerTimes(body, t),
      () => body.innerHTML = '<p>Could not load prayer times — check the internet connection.</p>'
    );
  } else if (panel === 'whatsapp') {
    title.textContent = 'Join WhatsApp';
    body.innerHTML = '<img src="assets/WhatsApp Invite Flyer.jpeg" class="flyer-image" alt="Scan to join our WhatsApp community">';
  } else if (panel === 'announcements') {
    title.textContent = 'Announcements';
    loadListDoc('hub_content/announcements', body, 'No announcements right now.');
  } else if (panel === 'events') {
    title.textContent = 'Events';
    renderProgramsCalendar(body);
  } else if (panel === 'donate') {
    title.textContent = 'Donate';
    body.innerHTML = `
      <div class="donate-content">
        <div class="donate-qr-card">
          <img src="assets/Donations QR CODE.png" class="donate-qr" alt="Scan to donate">
          <div class="donate-qr-caption">Scan to Donate</div>
        </div>
      </div>
    `;
  } else if (panel === 'about') {
    title.textContent = 'About & Contact';
    body.innerHTML = `
      <div class="about-content">
        <img src="assets/Al-Hayy Logo.png" class="about-logo" alt="Masjid Al-Hayy">
        <div class="about-mission-heading">Our Mission</div>
        <div class="about-mission-rule"></div>
        <p class="about-mission-text">Our mission is to provide the highest quality of religious, educational, and social services to our entire community as well as support and promote a comprehensive Islamic way of life as outlined in the Holy Quran, and the teachings of Prophet Muhammad (Peace Be Upon Him) and his progeny (Ahlulbayt). We actively engage and contribute towards strengthening the bonds between Muslims and Non-Muslims alike by establishing a united community through effective interfaith partnerships, dialogue and fostering respect within Seminole County and the broader Central Florida region.</p>
      </div>
    `;
  }
}

// Reads a Firestore doc at hub_content/{id} with fields: items (array of {date, text})
// or, for simple pages, a single "text" field.
function loadListDoc(path, body, emptyMessage, simpleText) {
  const [collection, id] = path.split('/');
  db.collection(collection).doc(id).get().then(doc => {
    if (!doc.exists) {
      body.innerHTML = `<p>${emptyMessage}</p>`;
      return;
    }
    const data = doc.data();
    if (simpleText) {
      body.innerHTML = `<p>${(data.text || emptyMessage).replace(/\n/g, '<br>')}</p>`;
      return;
    }
    const items = data.items || [];
    if (items.length === 0) {
      body.innerHTML = `<p>${emptyMessage}</p>`;
      return;
    }
    body.innerHTML = items.map(item => `
      <div class="announcement-item">
        <div class="announcement-date">${item.date || ''}</div>
        <div>${item.text || ''}</div>
      </div>
    `).join('');
  }).catch(() => {
    body.innerHTML = `<p>${emptyMessage}</p>`;
  });
}

function getPrayerTimes(onLoaded, onError) {
  const today = new Date().toISOString().slice(0, 10);
  const cacheKey = `prayerTimes_${today}_${KIOSK_CONFIG.calculationMethod}_mm1`;
  const cached = localStorage.getItem(cacheKey);

  if (cached) {
    onLoaded(JSON.parse(cached));
    return;
  }

  const { latitude, longitude, calculationMethod } = KIOSK_CONFIG;
  const url = `https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=${calculationMethod}&midnightMode=1`;

  fetch(url)
    .then(res => res.json())
    .then(data => {
      const t = data.data.timings;
      localStorage.setItem(cacheKey, JSON.stringify(t));
      onLoaded(t);
    })
    .catch(onError);
}

function to12Hour(time24) {
  const [h, m] = time24.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${String(m).padStart(2, '0')} ${period}`;
}

function renderPrayerTimes(body, t) {
  const order = ['Fajr', 'Sunrise', 'Dhuhr', 'Maghrib', 'Midnight'];
  body.innerHTML = `<div class="prayer-grid">` + order.map(name => `
    <div class="prayer-card">
      <div class="name">${name}</div>
      <div class="time">${to12Hour(t[name])}</div>
    </div>
  `).join('') + `</div>`;
}

/* ============================================================
   EVENTS PANEL — Programs calendar
   Data source: Firestore `programs` collection, one doc per ISO
   date (YYYY-MM-DD), e.g. programs/2026-09-17. See CLAUDE.md /
   plan docs for the full schema (items[], hijriSubtitle, etc).
   ============================================================ */
const CALENDAR_MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];
const CALENDAR_WEEKDAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

function toIsoDateLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseIsoDateLocal(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function renderProgramsCalendar(body) {
  if (!calendarSelectedDate) calendarSelectedDate = toIsoDateLocal(new Date());
  body.innerHTML = `
    <div class="calendar-view">
      <div class="calendar-nav">
        <button class="calendar-nav-btn" id="cal-prev">‹</button>
        <div class="calendar-month-label" id="cal-month-label"></div>
        <button class="calendar-nav-btn" id="cal-next">›</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <div class="calendar-day-detail" id="calendar-day-detail"></div>
    </div>
  `;
  document.getElementById('cal-prev').addEventListener('click', () => changeCalendarMonth(-1));
  document.getElementById('cal-next').addEventListener('click', () => changeCalendarMonth(1));
  subscribeToProgramsMonth(calendarViewDate);
}

function changeCalendarMonth(delta) {
  calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);
  subscribeToProgramsMonth(calendarViewDate);
}

function subscribeToProgramsMonth(dateObj) {
  if (programsUnsub) { programsUnsub(); programsUnsub = null; }
  const year = dateObj.getFullYear();
  const month = dateObj.getMonth();
  const start = toIsoDateLocal(new Date(year, month, 1));
  const end = toIsoDateLocal(new Date(year, month + 1, 0));

  const onData = snapshot => {
    currentMonthPrograms = {};
    snapshot.docs.forEach(doc => { currentMonthPrograms[doc.id] = doc.data(); });
    renderCalendarMonthGrid(dateObj);
    renderCalendarDayDetail();
  };
  const onError = () => {
    currentMonthPrograms = {};
    renderCalendarMonthGrid(dateObj);
    renderCalendarDayDetail();
  };

  programsUnsub = db.collection('programs')
    .where('date', '>=', start)
    .where('date', '<=', end)
    .onSnapshot(onData, onError);
}

function renderCalendarMonthGrid(dateObj) {
  const grid = document.getElementById('calendar-grid');
  const monthLabel = document.getElementById('cal-month-label');
  if (!grid || !monthLabel) return;

  const year = dateObj.getFullYear();
  const month = dateObj.getMonth();
  monthLabel.textContent = `${CALENDAR_MONTH_NAMES[month]} ${year}`;

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayIso = toIsoDateLocal(new Date());

  let cellsHtml = CALENDAR_WEEKDAY_LABELS.map(l => `<div class="calendar-weekday">${l}</div>`).join('');

  for (let i = 0; i < 42; i++) {
    const dayNum = i - firstWeekday + 1;
    if (dayNum < 1 || dayNum > daysInMonth) {
      cellsHtml += `<div class="calendar-day calendar-day-empty"></div>`;
      continue;
    }
    const cellIso = toIsoDateLocal(new Date(year, month, dayNum));
    const hasProgram = !!currentMonthPrograms[cellIso];
    const classes = ['calendar-day'];
    if (cellIso === todayIso) classes.push('calendar-day-today');
    if (cellIso === calendarSelectedDate) classes.push('calendar-day-selected');
    cellsHtml += `
      <div class="${classes.join(' ')}" data-date="${cellIso}">
        <div class="calendar-day-num">${dayNum}</div>
        ${hasProgram ? '<div class="calendar-day-dot"></div>' : ''}
      </div>
    `;
  }

  grid.innerHTML = cellsHtml;
  grid.onclick = e => {
    const cell = e.target.closest('.calendar-day[data-date]');
    if (!cell) return;
    calendarSelectedDate = cell.dataset.date;
    renderCalendarMonthGrid(calendarViewDate);
    renderCalendarDayDetail();
  };
}

function renderCalendarDayDetail() {
  const detail = document.getElementById('calendar-day-detail');
  if (!detail) return;

  const data = currentMonthPrograms[calendarSelectedDate];
  const dateLabel = parseIsoDateLocal(calendarSelectedDate)
    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  const items = (data && data.items) || [];
  const hasOccasion = !!(data && data.specialOccasion);
  const hasHijri = !!(data && data.hijriSubtitle);

  if (!data || (items.length === 0 && !hasOccasion && !hasHijri)) {
    detail.innerHTML = `
      <div class="calendar-selected-date">${dateLabel}</div>
      <p>No programs scheduled.</p>
    `;
    return;
  }

  detail.innerHTML = `
    <div class="calendar-selected-date">${dateLabel}</div>
    ${hasOccasion ? `<div class="calendar-occasion">${data.specialOccasion}</div>` : ''}
    ${hasHijri ? `<div class="calendar-hijri-subtitle">${data.hijriSubtitle}</div>` : ''}
    ${items.map(item => `
      <div class="calendar-program-item">
        <div class="calendar-program-time">${to12Hour(item.time)}</div>
        <div class="calendar-program-label">
          ${item.label || ''}${item.speaker ? ` — ${item.speaker}` : ''}
          ${item.note ? `<div class="calendar-program-note">${item.note}</div>` : ''}
        </div>
      </div>
    `).join('')}
  `;
}
</script>
</body>
</html>
